[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-finder"
version = "2.0.0a5"
description = "Multi-layer IP address intelligence tool (offline analysis, geolocation, network and threat data)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "dipro20debnath" }]
keywords = ["ip", "geolocation", "osint", "networking", "ipv6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: System :: Networking",
]
dependencies = [
    "rich>=13.0",
    "httpx>=0.27",
    "dnspython>=2.6",
    "maxminddb>=2.5",
    # Windows has no system time-zone database; zoneinfo needs this package there.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
ipfinder = "ipfinder.cli:main"

[tool.setuptools.packages.find]
include = ["ipfinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
# Docs are prose; do not reformat the Python snippets inside them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
